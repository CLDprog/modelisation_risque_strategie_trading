# IBeam — automated IBKR Client Portal Gateway (replaces TWS).
# Holds an authenticated brokerage session and exposes the Web API on
# https://127.0.0.1:5000. The collector and dashboard talk to THIS, not TWS.
#
# Usage (from the architecture_risque/ folder):
#   1. Fill IBEAM_ACCOUNT / IBEAM_PASSWORD in .env  (paper login)
#   2. docker compose -f gateway/docker-compose.yml up -d
#   3. Wait ~30s, then: python scripts/bootstrap_webapi.py
#
# Notes:
#   - Self-signed cert on :5000 → the adapter uses cacert=false (no TLS verify).
#   - Paper accounts generally need no 2FA, so IBeam can stay up unattended.
#   - Stop with: docker compose -f gateway/docker-compose.yml down
services:
  ibeam:
    image: voyz/ibeam:latest
    container_name: ibeam
    env_file:
      - ../.env            # provides IBEAM_ACCOUNT and IBEAM_PASSWORD
    environment:
      IBEAM_GATEWAY_BASE_URL: "https://localhost:5000"
    ports:
      - "5000:5000"
    restart: unless-stopped

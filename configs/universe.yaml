options:
  exchange: EUREX
  currency: EUR
  maturity_window_days: 1095     # jusqu'à 3 ans (grille cible dans la spec)
  min_days_to_expiry: 1          # inclure les très courtes échéances
  max_strikes_per_side: 8        # provisoire — Step 2 : sélection par delta (±30Δ)
  # Grille réduite (choix 2026-06-09) — surcharge les défauts de live.py.
  # Spec prof = 12 tenors + ATM±10/20/30 ; ici 7 tenors cœur + ATM±10/30.
  # 548j (18m) rajouté le 2026-06-10 : comble le trou 365→730 (meilleure interpolation Eq.22).
  target_tenors_days: [30, 91, 182, 273, 365, 548, 730]   # 1m,3m,6m,9m,12m,18m,24m
  delta_ladder: [0.10, 0.30]                                # ailes ; ATM ajouté en plus

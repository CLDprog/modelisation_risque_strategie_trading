# Univers : EURO STOXX 50 (indice) + ses 50 sociétés composantes.
# Liste figée depuis la composition officielle STOXX (Wikipedia, révision du 22/09/2025).
# Devise EUR ; options EUREX. Spec de référence : docs/specification_eurostoxx.md
#
# `ibkr_symbol` (optionnel) = ticker utilisé pour la résolution IBKR quand il diffère
#   de l'id interne `symbol` (doublon SAN Sanofi/Santander ; Sanofi = SAN1 chez IBKR).
# `option_exchange` (optionnel) = bourse d'options PAR SOUS-JACENT quand les options
#   n'existent pas sur EUREX (BBVA/IBE → MEFFRV, ARGX → BELFOX). Défaut : options.exchange.
# Diagnostic live 2026-06-10 : 50/51 résolus avec options ; NDA (Nordea) sans données
#   (pas d'entitlement Nasdaq Nordic — voir docs/known_limitations.md).
